<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Kaftar Messenger</title>
    <link rel="icon" type="image/x-icon" href="assets/logo/favicon.ico">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="magma-glow-container">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <main class="welcome-container">
        <section class="welcome-content">
            <h1 class="brand-title">KAFTAR MESSENGER</h1>
            <p class="brand-description">
                Experience the next generation of secure, ultra-fast, and futuristic communication. Connect with your community instantly with cyberpunk neon aesthetics.
            </p>
            
            <div class="auth-buttons">
                <a href="#" class="btn btn-login" id="openLoginModal">
                    <span>Login</span>
                    <i class="fas fa-sign-in-alt"></i>
                </a>
                <a href="#" class="btn btn-signup" id="openSignupModal">
                    <span>Sign Up</span>
                    <i class="fas fa-user-plus"></i>
                </a>
            </div>
        </section>

        <section class="welcome-visual">
            <div class="gif-placeholder-wrapper">
                <div class="gif-circle-container">
                    <img src="assets/logo/mainpage.gif" alt="Kaftar Core" class="main-dynamic-gif">
                    <div class="neon-ring"></div>
                </div>
            </div>
        </section>
    </main>

    
    <div class="auth-modal-overlay" id="authModal">
    <div class="auth-modal-box">

        <button class="auth-modal-close" id="closeAuthModal">
            <i class="fas fa-times"></i>
        </button>

        
    <form class="auth-form active" id="loginForm">
    <h2>Login</h2>
    <p>Login to your account</p>

    <div class="auth-input-group">
        <i class="fas fa-id-card"></i>
        <input type="text" id="loginUserId" placeholder="User ID">
    </div>

    <div class="auth-input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="loginPassword" placeholder="Password">
    </div>

    <button type="submit" class="auth-submit-btn">Login</button>

    <span class="switch-auth-text">
        Don't have an account?
        <button type="button" id="switchToSignup">Sign Up</button>
    </span>
    </form>


        <!-- Sign Up Form -->
    <form class="auth-form" id="signupForm">
    <h2>Sign Up</h2>
    <p>Create your account</p>

    <div class="auth-input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="signupFullname" placeholder="Full Name">
    </div>

    <div class="auth-input-group">
        <i class="fas fa-id-card"></i>
        <input type="text" id="signupUserId" placeholder="User ID">
    </div>

    <div class="auth-input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="signupPassword" placeholder="Password">
    </div>

    <div class="auth-input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="signupRepeatPassword" placeholder="Repeat Password">
    </div>

    <button type="submit" class="auth-submit-btn">
        Create Account
    </button>

    <span class="switch-auth-text">
        Already have an account?
        <button type="button" id="switchToLogin">Login</button>
    </span>
    </form>


    </div>
</div>

<script src="welcome.js"></script>

</body>
</html>
