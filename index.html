<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Kaftar Messenger</title>
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="magma-glow-container">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <main class="welcome-container">
        <section class="welcome-content">
            <h1 class="brand-title">KAFTAR MESSENGER</h1>
            <p class="brand-description">
                Experience the next generation of secure, ultra-fast, and futuristic communication. Connect with your community instantly with cyberpunk neon aesthetics.
            </p>
            
            <div class="auth-buttons">
                <a href="#" class="btn btn-login">
                    <span>Login</span>
                    <i class="fas fa-sign-in-alt"></i>
                </a>
                <a href="#" class="btn btn-signup">
                    <span>Sign Up</span>
                    <i class="fas fa-user-plus"></i>
                </a>
            </div>
        </section>

        <section class="welcome-visual">
            <div class="gif-placeholder-wrapper">
                <div class="gif-circle-container">
                    <img src="assets/mainpage.gif" alt="Kaftar Core" class="main-dynamic-gif">
                    <div class="neon-ring"></div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
