<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaftar Messenger</title>
    <link rel="icon" type="image/x-icon" href="assets/logo/favicon.ico">
    <link rel="stylesheet" href="assets/css/chat.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-avatar main-avatar"></div>
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="sidebarSearch" placeholder="Search Chats">
                </div>
                <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Theme">
                    <i class="fas fa-sun"></i>
                </button>
            </div>

            <div id="archivedFolderHeader" style="display: none; align-items: center; padding: 10px 15px; border-bottom: 1px solid var(--border-light); background-color: rgba(0,0,0,0.1);">
                <button id="archiveBackBtn" style="background: none; border: none; color: var(--text-main); font-size: 16px; cursor: pointer; margin-right: 12px;">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <span style="font-weight: 600; font-size: 14px; color: var(--text-white);">Archived Chats</span>
            </div>

            <div class="chatroom-list"></div> <!-- Designed in JavaScript -->
            <button class="fab-add-btn" id="openContactsBtn">
                <i class="fas fa-plus"></i>
            </button>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <div class="current-room-details">
                    <button class="back-btn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    
                    <div class="room-avatar header-avatar">⚠</div>
                    <div class="room-status">
                        <h3 class="current-room-name">No Chats Yet</h3>
                        <span class="last-online"></span>
                    </div>
                </div>
                <div class="header-right-controls" style="display: flex; align-items: center; gap: 15px;">
                    <div class="search-box" id="headerSearchBox" style="display: none;">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="headerMsgSearch" placeholder="Search messages...">
                    </div>
                    <div class="header-settings">
                        <i class="fas fa-cog gear-icon" title="setting gear icon"></i>
                    </div>
                </div>
            </header>

            <div class="messages-container"></div> <!-- Designed in JavaScript -->

            <footer class="chat-footer">
                <div class="input-container">
                    <button class="action-btn plus-btn"><i class="fas fa-plus"></i></button>
                    <input type="text" placeholder="Type a message...">
                    
                    <button class="outer-send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </footer>
        </main>
    </div>

    <div class="modal-overlay" id="contactsModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Start New Chat</h3>
                <button class="modal-close-btn" id="closeContactsBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="modal-group-section">
                <button class="modal-create-group-btn" id="createGroupModalBtn">
                    <i class="fas fa-users"></i> Create New Group
                </button>
                <div class="group-creation-form" id="groupCreationForm">
                    <input type="text" id="groupNameInput" placeholder="Enter Group Name...">
                    <div class="form-actions">
                        <button id="submitGroupBtn" class="btn-confirm">Confirm</button>
                        <button id="cancelGroupBtn" class="btn-cancel">Cancel</button>
                    </div>
                </div>
            </div>
            <div class="modal-divider"></div>
            <div class="modal-contacts-list" id="modalContactsList">
                </div>
        </div>
    </div>

    <div id="groupAddMemberModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Add New Member</h3>
                <button id="closeGroupAddMemberBtn" class="modal-close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="groupAddMemberContactsList" class="modal-contacts-list">
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="profileSettingsModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Profile Settings</h3>
                <button class="modal-close-btn" id="closeProfileSettingsBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="profile-setup-container">
                <div class="profile-avatar-wrapper">
                    <div class="profile-modal-avatar" id="profileModalAvatar">?</div>
                    <label for="avatarFileInput" class="avatar-upload-overlay" title="Change Avatar">
                        <i class="fas fa-camera"></i>
                    </label>
                    <input type="file" id="avatarFileInput" accept="image/*" style="display: none;">
                    <button class="avatar-delete-btn" id="deleteAvatarBtn" title="Delete Avatar">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>

                <div class="profile-settings-form">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="settingsUsername" placeholder="Username..." readonly style="opacity: 0.6; cursor: not-allowed;">
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="settingsFullName" placeholder="Your Name...">
                    </div>
                    <div class="form-group">
                        <label>Bio</label>
                        <textarea id="settingsBio" placeholder="Tell us about yourself..." rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="settingsPhone" placeholder="+123456789...">
                    </div>
                    <div class="form-group" id="modalGroupMembersSection" style="display: none; margin-top: 10px;">
                        <label>Group Members List</label>
                        <div id="modalGroupMembersList" style="max-height: 120px; overflow-y: auto; background: var(--bg-input); padding: 8px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border-light);">
                        </div>
                    </div>
                    
                    <button id="saveProfileBtn" class="btn-confirm profile-save-btn">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="groupLogsModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 480px;">
            <div class="modal-header">
                <h3>Group Edit & Delete Logs</h3>
                <button id="closeGroupLogsBtn" class="modal-close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="log-toggle-container">
                <button id="logEditedTabBtn" class="log-tab-btn active">Edited</button>
                <button id="logDeletedTabBtn" class="log-tab-btn">Deleted</button>
            </div>
            <div class="modal-divider" style="margin: 12px 0;"></div>
            <div id="groupLogsList" class="modal-contacts-list" style="max-height: 300px;">
            </div>
        </div>
    </div>

    <div id="messageContextMenu" class="context-menu" style="display: none; position: absolute; z-index: 2000;">
        <button id="ctxEditBtn"><i class="fas fa-edit"></i> Edit</button>
        <button id="ctxDeleteBtn" class="delete-item"><i class="fas fa-trash-alt"></i> Delete</button>
    </div>

    <div id="headerSettingsMenu" class="context-menu" style="display: none; position: absolute; z-index: 2000;">
        <button id="headerViewProfileBtn"><i class="fas fa-info-circle"></i> Profile</button>
        <div id="dynamicHeaderSettingsActions"></div> <!-- Designed in JavaScript -->
    </div>

    <script src="script.js"></script>
</body>
</html>
