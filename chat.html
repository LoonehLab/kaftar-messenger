<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaftar Messenger</title>
    <link rel="icon" type="image/x-icon" href="assets/logo/favicon.ico">
    <link rel="stylesheet" href="assets/css/chat.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-avatar main-avatar"></div>
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="sidebarSearch" placeholder="Search Chats">
                </div>
                <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Theme">
                    <i class="fas fa-sun"></i>
                </button>
            </div>

            <div class="chatroom-list"></div> <!-- Designed in JavaScript -->
            <button class="fab-add-btn" id="openContactsBtn">
                <i class="fas fa-plus"></i>
            </button>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <div class="current-room-details">
                    <button class="back-btn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    
                    <div class="room-avatar header-avatar">⚠</div>
                    <div class="room-status">
                        <h3 class="current-room-name">No Chats Yet</h3>
                        <span class="last-online"></span>
                    </div>
                </div>
                <div class="header-settings">
                    <i class="fas fa-cog gear-icon" title="setting gear icon"></i>
                </div>
            </header>

            <div class="messages-container"></div> <!-- Designed in JavaScript -->

            <footer class="chat-footer">
                <div class="input-container">
                    <button class="action-btn plus-btn"><i class="fas fa-plus"></i></button>
                    <input type="text" placeholder="Type a message...">
                    
                    <button class="outer-send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </footer>
        </main>
    </div>

    <div class="modal-overlay" id="contactsModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Start New Chat</h3>
                <button class="modal-close-btn" id="closeContactsBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="modal-group-section">
                <button class="modal-create-group-btn" id="createGroupModalBtn">
                    <i class="fas fa-users"></i> Create New Group
                </button>
                <div class="group-creation-form" id="groupCreationForm">
                    <input type="text" id="groupNameInput" placeholder="Enter Group Name...">
                    <div class="form-actions">
                        <button id="submitGroupBtn" class="btn-confirm">Confirm</button>
                        <button id="cancelGroupBtn" class="btn-cancel">Cancel</button>
                    </div>
                </div>
            </div>
            <div class="modal-divider"></div>
            <div class="modal-contacts-list" id="modalContactsList">
                </div>
        </div>
    </div>

    <div class="modal-overlay" id="profileSettingsModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Profile Settings</h3>
                <button class="modal-close-btn" id="closeProfileSettingsBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="profile-setup-container">
                <div class="profile-avatar-wrapper">
                    <div class="profile-modal-avatar" id="profileModalAvatar">?</div>
                    <label for="avatarFileInput" class="avatar-upload-overlay" title="Change Avatar">
                        <i class="fas fa-camera"></i>
                    </label>
                    <input type="file" id="avatarFileInput" accept="image/*" style="display: none;">
                    <button class="avatar-delete-btn" id="deleteAvatarBtn" title="Delete Avatar">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>

                <div class="profile-settings-form">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="settingsUsername" placeholder="Username..." readonly style="opacity: 0.6; cursor: not-allowed;">
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="settingsFullName" placeholder="Your Name...">
                    </div>
                    <div class="form-group">
                        <label>Bio</label>
                        <textarea id="settingsBio" placeholder="Tell us about yourself..." rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="settingsPhone" placeholder="+123456789...">
                    </div>
                    
                    <button id="saveProfileBtn" class="btn-confirm profile-save-btn">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="messageContextMenu" class="context-menu" style="display: none; position: absolute; z-index: 2000;">
        <button id="ctxEditBtn"><i class="fas fa-edit"></i> Edit</button>
        <button id="ctxDeleteBtn" class="delete-item"><i class="fas fa-trash-alt"></i> Delete</button>
    </div>

    <div id="headerSettingsMenu" class="context-menu" style="display: none; position: absolute; z-index: 2000;">
        <button id="headerViewProfileBtn"><i class="fas fa-info-circle"></i> Profile </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
